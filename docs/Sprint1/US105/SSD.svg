if" font-size="13" lengthAdjust="spacing" textLength="132" x="89" y="143.4966">Shows requested list</text><!--MD5=[5db2e4d2a016b3cf3f40021ad7bf9f5b]
@startuml
actor "traffic manager" as actor
participant system as sys
autonumber
activate actor
actor -> sys : Requests  a list for all ships(MMSI, total number of movements, Travelled Distance and Delta Distance).
activate sys

sys - -> actor : Shows requested list
deactivate sys
deactivate actor
@enduml

