link ShipStore to Ship--><path codeLine="43" d="M82.5,477.27 C82.5,493.07 82.5,511.8 82.5,531.19 " fill="none" id="ShipStore-to-Ship" style="stroke:#A80036;stroke-width:1.0;"/><polygon fill="#A80036" points="82.5,536.68,86.5,527.68,82.5,531.68,78.5,527.68,82.5,536.68" style="stroke:#A80036;stroke-width:1.0;"/><!--MD5=[29f819877006b3682f2d163d92062d48]
@startuml
skinparam classAttributeIconSize 0

class Company {
-designation
+getShipStore()
}
class SummaryController {
+getShip(code)
+getShipSummary(Ship ship)

}
class SummaryUI {
}
class ShipStore{
+getShipByMMSI(MMSI)
+getShipByIMO(IMO)
+getShipByCallSign(callSign)
}

class Ship{
+getVesselName()
+getStartBDT()
+getEndBDT()
+getTotalTimeInSea()
+numberOfMovements()
+getMaxSOG()
+getMeanSOG()
+getMaxCOG()
+getMeanCOG()
+getDepartureLatitude()
+getDepartureLongitude()
+getArrivalLatitude()
+getArrivalLongitude()
+getTotalDistance()
+deltaDistance()

}


SummaryUI ..> SummaryController
SummaryController ..> Company
Company - -> ShipStore
ShipStore - -> Ship




@enduml

