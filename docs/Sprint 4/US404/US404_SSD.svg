="spacing" textLength="7" x="71" y="171.9834">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317" x="82" y="163.8076">shows the number of idle days of each ship associated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127" x="82" y="180.1592">with the fleet manager</text><!--MD5=[937df6f16d0cf06613886884b194fb27]
@startuml
autonumber
actor "Fleet Manager" as FM

activate FM
FM -> ":System" : requests the number of idle days of each ship\nsince the beginning of the current year
activate ":System"
":System" - -> FM : shows the number of idle days of each ship associated\nwith the fleet manager
deactivate ":System"
deactivate FM

@enduml

