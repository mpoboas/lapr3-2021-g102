 y="589.8389">result</text><polygon fill="#A80036" points="42,621.0469,32,625.0469,42,629.0469,38,625.0469" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="36" x2="555" y1="625.0469" y2="625.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="48" y="620.1904">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="478" x="66" y="620.1904">shows the given container´s route (locations, times of arrival and mean of transport)</text><!--MD5=[0cae244f0800f2c6f3243335bd184143]
@startuml
autonumber
'hide footbox

actor "Client" as CL

participant "ContainerRouteUI" as UI
participant "GetClientContainerRouteController" as CTRL
participant "ContainerDB" as CONTAINERDB
participant ConnectionFactory as CF
participant DatabaseConnection as DC
database LAPR3_G102 as DB

activate CL
CL -> UI : requests the route of a specific container that is being leased,\ngiven a registration code and container identifier
activate UI
UI - -> CL : requests all the needed data (user registration code and container id)
deactivate UI

CL -> UI : types data
activate UI

UI -> CF** : create()
activate CF
CF -> DC** : create()
activate DC
DC - -> DB
activate DB
deactivate DB
deactivate DC
deactivate CF

UI -> CTRL : getClientContainerRoute(databaseConnection, clientUsername, containerId)
activate CTRL
CTRL -> CONTAINERDB : getClientContainerRoute(databaseConnection, clientUsername, containerId)
activate CONTAINERDB

CONTAINERDB -> DC : connection = getConnection()
activate DC
deactivate DC

CONTAINERDB -> DB : fnc_get_client_container_route(clientUsername, containerId)
activate DB
deactivate DB
CONTAINERDB - -> CTRL : result
deactivate CONTAINERDB
deactivate CONTAINERDB
CTRL - -> UI : result
deactivate CTRL
UI - -> CL : shows the given container´s route (locations, times of arrival and mean of transport)
deactivate UI
@enduml

