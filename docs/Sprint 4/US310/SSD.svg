t="spacing" textLength="9" x="66" y="230.895">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88" x="79" y="230.895">confirms data</text><polygon fill="#A80036" points="65,261.0938,55,265.0938,65,269.0938,61,265.0938" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="59" x2="442" y1="265.0938" y2="265.0938"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="71" y="260.0278">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143" x="84" y="260.0278">shows requestd report</text><!--MD5=[14f09a17b6b3063dc92270d80a6bd06e]
@startuml
actor "Port Manager" as pm
participant System as sys
autonumber
activate pm
pm -> sys : Asks for map of port ocupation during a certain month
activate sys
sys - -> pm : Asks which port and which month
deactivate sys
pm -> sys : inserts requested data
activate sys
sys - -> pm : asks for confirmation
deactivate sys
pm -> sys : confirms data
activate sys
sys - -> pm : shows requestd report
deactivate sys
deactivate pm


@enduml

