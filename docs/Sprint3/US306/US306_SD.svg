.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="499" x2="1123" y1="626.6953" y2="626.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="511" y="621.8389">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32" x="529" y="621.8389">result</text><polygon fill="#A80036" points="42,653.0469,32,657.0469,42,661.0469,38,657.0469" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="36" x2="488" y1="657.0469" y2="657.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="48" y="652.1904">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411" x="66" y="652.1904">shows the occupancy rate of each warehouse and the desired estimate</text><!--MD5=[3da80781b2e428343ed855fd00994042]
@startuml
autonumber
'hide footbox

actor "Client" as CL

participant "WarehouseOccupancyRateUI" as UI
participant "GetWarehouseOccupancyRateController" as CTRL
participant "PortWarehouseDB" as PORTWDB
participant ConnectionFactory as CF
participant DatabaseConnection as DC
database LAPR3_G102 as DB

activate CL
CL -> UI : requests the occupancy rate of each warehouse and an estimate\nof the containers leaving the warehouse during the next 30 days
activate UI

UI -> CF** : create()
activate CF
CF -> DC** : create()
activate DC
DC - -> DB
activate DB
deactivate DB
deactivate DC
deactivate CF

UI -> CTRL : getEachWarehouseOccupancyRateAndContainersLeaving30Days(databaseConnection, portManagerId)
activate CTRL
CTRL -> PORTWDB : getEachWarehouseOccupancyRateAndContainersLeaving30Days(databaseConnection, portManagerId)
activate PORTWDB

PORTWDB -> CF : connection = getConnection()
activate CF
deactivate CF

PORTWDB -> DB : fnc_get_each_warehouse_occupancy_rate_next_30_days(portManagerId)
activate DB
deactivate DB
loop for each warehouse
PORTWDB -> DB : fnc_get_containers_leaving_next_30_days(portWarehouseId)
activate DB
deactivate DB
end

PORTWDB - -> CTRL : result
deactivate PORTWDB
deactivate PORTWDB
CTRL - -> UI : result
deactivate CTRL

UI - -> CL : shows the occupancy rate of each warehouse and the desired estimate
deactivate UI
@enduml

