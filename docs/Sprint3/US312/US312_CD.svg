@startuml
'https://plantuml.com/class-diagram

class GetContainerSituationUI{}
class GetContainerSituationController{
+getSituation(containerID,user)
}
class App{
-company
-authfacade
+getInstance()
+getCurrentUserSession()
}
class ContainerSituationDB{
+getSituation(containerID,user)
}
class ConnectionFactory{
-getInstance()
-loadProperties()
+getDatabaseConnection()
}
class DatabaseConnection{
-oracleDataSource
-connection
-error
+getConnection()
+registerError(SQLException error)
+getLastError()
}

GetContainerSituationUI .. GetContainerSituationController
GetContainerSituationController . ContainerSituationDB
GetContainerSituationController .. App
ContainerSituationDB - ConnectionFactory : requests connection to database to obtain data >
ConnectionFactory - - DatabaseConnection : fabricate a >

@enduml

