"79" y="147.4561">shows a warning if the warehouse's available capacity</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70" x="83" y="163.8076">is exceeded</text><!--MD5=[20f080dd1d6c3a4c72a487281631fbd9]
@startuml
autonumber
actor "Port Manager" as PM

activate PM
PM -> ":System" : issues a cargo manifest destined for a warehouse
activate ":System"
":System" - -> PM : shows a warning if the warehouse's available capacity\n is exceeded
deactivate ":System"
deactivate PM

@enduml

