@startuml
'https://plantuml.com/class-diagram

class Company {
-designation
}

class ContainerRouteUI {
}

class GetClientContainerRouteController {
+getContainerRoute(userId, containerId)
}

class ContainerDB {
+getContainerRoute(userId, containerId)
}

class ConnectionFactory{
+getInstance()
+yloadProperties()
+getDatabaseConnection()
}

class DatabaseConnection{
-oracleDataSource
-connection
-error
+getConnection()
+registerError(SQLException error)
+getLastError()
}

ContainerRouteUI ..> GetClientContainerRouteController
GetClientContainerRouteController ..> ContainerDB
GetClientContainerRouteController ..> Company
ContainerDB ..> ConnectionFactory
ConnectionFactory ..> DatabaseConnection

@enduml

