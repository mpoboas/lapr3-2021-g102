@startuml
actor "Port Manager" as Pman
participant System as sys
activate Pman

Pman -> sys : asks to import ports from file
activate sys
sys - ->Pman : requests data (file directory)
deactivate sys
Pman -> sys :inserts requested data
activate sys
sys - -> Pman :shows how many ports were imported
deactivate sys
Pman -> sys :confirms the data
activate sys
sys - -> Pman :informs operation success
deactivate Pman
@enduml

