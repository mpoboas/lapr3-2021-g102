@startuml
class Ship {
-MMSI
-name
-IMO
-nrGenerators
-pwrOutput
-callSign
-vesselType
-length
-width
-capacity
-draft
-baseDateTime
-latitude
-longitude
-SOG
-COG
-heading
-position
-transceiverClass
-List<Trips> trips
}
class Trips{
-Port startingPort
-Port Destination
-List<Coordinates> CoordinatesSet
}
class Port{
-Identification
-Name
-Country
-Location
}
Ship "1" - - "*" Port : Travels between >
Ship "1" - - "*" Trips : does many >


@enduml

