1.0;stroke-dasharray:2.0,2.0;" x1="415" x2="724" y1="320.0703" y2="320.0703"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="427" y="315.2139">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="0" x="442" y="315.2139"/><polygon fill="#A80036" points="74,346.4219,64,350.4219,74,354.4219,70,350.4219" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="68" x2="404" y1="350.4219" y2="350.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="80" y="345.5654">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302" x="91" y="345.5654">shows the n most critical ports in the freight network</text><!--MD5=[00e96ce174f4220d6fbc236ef5d9b73b]
@startuml
autonumber
'hide footbox

actor "Traffic Manager" as TF

participant "MostCriticalPortsUI" as UI
participant "GetMostCriticalPortsController" as CTRL
participant Company as COMP
participant "freightNetwork : FreightNetwork" as FN
participant "mostCriticalPorts\n: List<Port>"

activate TF
TF -> UI : requests to know which ports are more critical\n(have greater centrality) in this freight network

activate UI
UI -> CTRL : mostCriticalPorts = getMostCriticalPorts(nPorts)
activate CTRL
CTRL -> COMP : freightNetwork = getFreightNetwork()
activate COMP
deactivate COMP
CTRL -> FN : getMostCriticalPorts(nPorts)
activate FN
FN - -> CTRL
deactivate FN

CTRL - -> UI
deactivate CTRL
UI - -> TF : shows the n most critical ports in the freight network
deactivate UI
@enduml

