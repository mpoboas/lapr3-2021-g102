@startuml
class Ship {
-MMSI
-name
-IMO
-nrGenerators
-pwrOutput
-callSign
-vesselType
-length
-width
-capacity
-draft
}
class Container {
-containerId
-containerPayload
-containerTare
-containerGross
-ISOcode
}
class CargoManifest {
-content
-elaborationDate
}

class LoadingCargoManifest {
}

class UnloadingCargoManifest {
}

LoadingCargoManifest "1" -u- "1" CargoManifest : is a >
UnloadingCargoManifest "*" -u- "1" CargoManifest : is a >
Container "*" - - "*" CargoManifest : contains <
Ship "1" - - "*" Container : carries >



@enduml

