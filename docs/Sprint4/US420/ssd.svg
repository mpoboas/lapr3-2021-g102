1" x2="472" y1="148.5625" y2="148.5625"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="73" y="143.4966">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375" x="86" y="143.4966">requests data (ship information and number of containers)</text><polygon fill="#A80036" points="456,173.6953,466,177.6953,456,181.6953,460,177.6953" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="56" x2="462" y1="177.6953" y2="177.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="63" y="172.6294">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145" x="76" y="172.6294">inserts requested data</text><polygon fill="#A80036" points="62,202.8281,52,206.8281,62,210.8281,58,206.8281" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="56" x2="472" y1="206.8281" y2="206.8281"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="68" y="201.7622">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79" x="81" y="201.7622">shows result</text><!--MD5=[1f58b96710546924b938e9add051f52c]
@startuml
autonumber
actor "Ship Captain" as SC
participant System as sys

activate SC
SC -> sys : requests how much will the ship sink with added cargo
activate sys
sys - -> SC : requests data (ship information and number of containers)
deactivate sys
SC -> sys : inserts requested data

activate sys
sys - -> SC : shows result
deactivate sys
deactivate SC
@enduml

