weight="bold" lengthAdjust="spacing" textLength="14" x="445" y="589.4873">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32" x="463" y="589.4873">result</text><polygon fill="#A80036" points="70,637.0469,60,641.0469,70,645.0469,66,641.0469" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="64" x2="422" y1="641.0469" y2="641.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="76" y="628.0146">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317" x="94" y="619.8389">shows the number of idle days of each ship associated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127" x="94" y="636.1904">with the fleet manager</text><!--MD5=[d7ebbdf30fbf82a189c6b358c71e9f4c]
@startuml
autonumber
'hide footbox

actor "Fleet Manager" as FM

participant "ShipIdleDaysUI" as UI
participant "GetShipIdleDaysController" as CTRL
participant "Company" as COMP
participant "shipStoreDB : ShipStoreDB" as SHIPDB
participant ConnectionFactory as CF
participant DatabaseConnection as DC
database LAPR3_G102 as DB

activate FM
FM -> UI : requests the number of idle days of each ship\nsince the beginning of the current year
activate UI

UI -> CF** : create()
activate CF
CF -> DC** : create()
activate DC
DC - -> DB
activate DB
deactivate DB
deactivate DC
deactivate CF

UI -> CTRL : getEachShipNumberOfIdleDays(databaseConnection, fleetManagerUsername, year)
activate CTRL
CTRL -> COMP : shipStoreDB = getShipStoreDB()
activate COMP
deactivate COMP
CTRL -> SHIPDB : getEachShipNumberOfIdleDays(databaseConnection, fleetManagerUsername, year)
activate SHIPDB

SHIPDB -> DC : connection = getConnection()
activate DC
deactivate DC

SHIPDB -> DB : fnc_get_each_ship_number_idle_days(fleetManagerUsername, year)
activate DB
deactivate DB
SHIPDB - -> CTRL : result
deactivate SHIPDB
deactivate SHIPDB
CTRL - -> UI : result
deactivate CTRL
UI - -> FM : shows the number of idle days of each ship associated\nwith the fleet manager
deactivate UI
@enduml

