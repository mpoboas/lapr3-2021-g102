ust="spacing" textLength="7" x="438" y="419.2139">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="0" x="453" y="419.2139"/><polygon fill="#A80036" points="74,450.4219,64,454.4219,74,458.4219,70,454.4219" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="68" x2="415" y1="454.4219" y2="454.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="80" y="449.5654">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313" x="91" y="449.5654">shows the map colored and the number of colors used</text><!--MD5=[c6bd55b9122b165448caae1d3c25cb36]
@startuml
autonumber
'hide footbox

actor "Traffic Manager" as TF

participant "ColorMapUI" as UI
participant "ColorMapController" as CTRL
participant Company as COMP
participant "FreightNetwork" as FN



activate TF
TF -> UI : asks to color the map using as few colors as possible

activate UI

UI -> COMP : freightNetwork = getFreightNetwork()
activate COMP
deactivate COMP
UI -> FN : graph = freightNetwork.getGraph()
activate FN
deactivate FN

UI -> CTRL : adjList = graphToAdjList(graph)
activate CTRL
deactivate CTRL

UI -> CTRL : coloredMap = colorMap(adjList)
activate CTRL
deactivate CTRL

UI -> CTRL : printColoredMap(coloredMap)
activate CTRL
CTRL - -> UI
deactivate CTRL
UI - -> TF : shows the map colored and the number of colors used
deactivate UI
@enduml

