@startuml
class PortOcupancyRateReport{
-idPort
-year
-month
-setDailyRate()
-setMaxAndMin()
-toString()
}
class PortReportController{
-idPort
-year
-month
-getDataAndGenerateReport()
-doReport()
-getReport()

}
class PortMonthlyReport{
-getDataFromDB()
-getPortFromDB(int idPort)
-fillArrayWithDBdata()
}


class Port{
-idPort
-name
-continente
-country
-coords
}
PortReportController -> PortMonthlyReport : Requests data from database >
PortReportController -> PortOcupancyRateReport : GIves data to generate report >
PortOcupancyRateReport -> Port : Accesses >
@enduml

