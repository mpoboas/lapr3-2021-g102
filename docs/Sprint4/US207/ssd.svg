="61" x2="550" y1="148.5625" y2="148.5625"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="73" y="143.4966">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195" x="86" y="143.4966">Requests which year is desired</text><polygon fill="#A80036" points="534,173.6953,544,177.6953,534,181.6953,538,177.6953" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="56" x2="540" y1="177.6953" y2="177.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="63" y="172.6294">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="76" y="172.6294">types requested data</text><polygon fill="#A80036" points="62,202.8281,52,206.8281,62,210.8281,58,206.8281" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="56" x2="550" y1="206.8281" y2="206.8281"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9" x="68" y="201.7622">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171" x="81" y="201.7622">Shows the desired number</text><!--MD5=[4e0b9ccfb28ebf7e74a90eba28c2312a]
@startuml
actor "Ship Captain" as sc
participant system as sys
autonumber
activate sc
sc -> sys: Requests how many cargo manifests he has transported in a given year
activate sys
sys - -> sc : Requests which year is desired
deactivate sys
sc ->sys : types requested data
activate sys
sys - -> sc : Shows the desired number
deactivate sys
deactivate sc

@enduml

