 font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="68" y="163.8076">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="411" x="79" y="163.8076">shows the occupancy rate of each warehouse and the desired estimate</text><!--MD5=[a2d9cea90d8f7247635b460f399ea9ba]
@startuml
autonumber
actor "Port Manager" as PM

activate PM
PM -> ":System" : requests the occupancy rate of each warehouse and an estimate\nof the containers leaving the warehouse during the next 30 days
activate ":System"
":System" - -> PM : shows the occupancy rate of each warehouse and the desired estimate
deactivate ":System"
deactivate PM

@enduml

