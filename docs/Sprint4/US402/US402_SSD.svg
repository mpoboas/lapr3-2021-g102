h="122" x="85" y="263.8623">types requested data</text><polygon fill="#A80036" points="89,302.0703,79,306.0703,89,310.0703,85,306.0703" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="83" x2="496" y1="306.0703" y2="306.0703"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124" x="95" y="301.2139">requests confirmation</text><polygon fill="#A80036" points="480,332.4219,490,336.4219,480,340.4219,484,336.4219" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="78" x2="486" y1="336.4219" y2="336.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78" x="85" y="331.5654">confirms data</text><polygon fill="#A80036" points="84,362.7734,74,366.7734,84,370.7734,80,366.7734" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="78" x2="496" y1="366.7734" y2="366.7734"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="90" y="361.917">Shows requested data</text><!--MD5=[29b9d58c9478a8f8decc6cbb3b7e20f8]
@startuml
actor "Traffic Manager" as tm
participant System as sys
activate tm
tm -> sys : Requests the shortest path between two places passing by n places
activate sys
sys - -> tm : requests Place of start, destination and n places
deactivate sys
tm -> sys :types requested data
loop
activate sys
sys - -> tm : requests which are the n places
tm -> sys : types requested data
deactivate sys
end loop
activate sys
sys - -> tm : requests confirmation
deactivate sys
tm -> sys : confirms data
activate sys
sys - -> tm : Shows requested data
deactivate sys
deactivate tm
@enduml

